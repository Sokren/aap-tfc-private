---
- name: Change httpd listening port to 8080 and deploy new website version (RHEL 10)
  hosts: all
  become: yes

  tasks:
    - name: Ensure httpd is installed
      dnf:
        name: httpd
        state: present

    - name: Ensure Git is installed (for clone)
      dnf:
        name: git
        state: present

    - name: Allow Apache (httpd) to listen on TCP port 8080 in SELinux
      community.general.seport:
        ports: 8080
        proto: tcp
        setype: http_port_t
        state: present

    - name: Update Listen port from 80 to 8080 in main httpd.conf
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^Listen\s+80'
        line: 'Listen 8080'
        state: present
        backrefs: no
      notify: Restart httpd

    - name: Create/Update default vhost to use port 8080
      copy:
        dest: /etc/httpd/conf.d/000-default.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <VirtualHost *:8080>
              DocumentRoot "/var/www/html"
              <Directory "/var/www/html">
                  AllowOverride All
                  Require all granted
              </Directory>

              ErrorLog  "/var/log/httpd/error_log"
              CustomLog "/var/log/httpd/access_log" combined
          </VirtualHost>
      notify: Restart httpd

    - name: Ensure /var/www/html exists
      file:
        path: /var/www/html
        state: directory
        owner: apache
        group: apache
        mode: '0755'

    - name: Clone GitHub repo
      git:
        repo: "https://github.com/Sokren/website-rh-hc.git"
        dest: /tmp/website
        version: main
        force: yes

    - name: Deploy new website version
      copy:
        src: "/tmp/website/Version-RH-HC/"
        dest: "/var/www/html"
        owner: apache
        group: apache
        mode: '0755'
        remote_src: yes
      notify: Restart httpd

    - name: Enable and start httpd (ensure it's running)
      service:
        name: httpd
        state: started
        enabled: yes

  handlers:
    - name: Restart httpd
      service:
        name: httpd
        state: restarted
