---
- name: Update website + rotate Vault secret
  hosts: all
  become: yes
  gather_facts: no

  # Chemin Vault propre à cet hôte / Per-host Vault secret path
  vars:
    vault_secret_path: "{{ inventory_hostname }}"  # le mount porte déjà le nom tfe-vault-aap-onchange

  pre_tasks:
    - name: Wait for system to become reachable
      wait_for_connection:
        delay: 10
        timeout: 120

    - name: Wait for cloud-init to complete
      command: cloud-init status --wait
      changed_when: false
      become: yes
      ignore_errors: yes

    - name: Gather facts after waiting
      setup:

  tasks:
    - name: Afficher le message de debug
      ansible.builtin.debug:
        msg: "coucou update"

    - name: Deploy new website version
      copy:
        src: "{{ playbook_dir }}/../../website/Version-RH-HC/"
        dest: "/var/www/html"
        owner: apache
        group: apache
        mode: '0755'
      notify: Restart httpd

    - name: Inject OS version into the website
      ansible.builtin.replace:
        path: /var/www/html/index.html
        regexp: '__OS_VERSION__'
        replace: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
      notify: Restart httpd

    # --- Vault : rotation + relecture + affichage ------------------
    # --- Vault: rotation + read-back + display ---------------------
    - name: "Vault | Générer une nouvelle valeur (rotation) / Generate a new value (rotation)"
      ansible.builtin.set_fact:
        vault_secret_value: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"
      no_log: true

    - name: "Vault | Mettre à jour le secret (nouvelle version KV v2) / Update the secret (new KV v2 version)"
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ vault_kv_mount }}/data/{{ vault_secret_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
          X-Vault-Namespace: "{{ vault_namespace }}"
        body_format: json
        body:
          data:
            value: "{{ vault_secret_value }}"
        status_code: [200, 204]
        validate_certs: "{{ not (vault_skip_verify | default(false) | bool) }}"
      delegate_to: localhost
      become: false
      register: vault_write
      failed_when: false
      no_log: true

    - name: "Vault | Diagnostic écriture (champs non sensibles) / Write diagnostic (safe fields)"
      ansible.builtin.debug:
        msg: >-
          Vault write → HTTP {{ vault_write.status | default('n/a') }}
          | url={{ vault_addr }}/v1/{{ vault_kv_mount }}/data/{{ vault_secret_path }}
          | ns={{ vault_namespace }}
          | msg={{ vault_write.msg | default('') }}
          | errors={{ vault_write.json.errors | default([]) }}

    - name: "Vault | Échec si l'écriture a raté / Fail if write failed"
      ansible.builtin.assert:
        that: "(vault_write.status | default(0) | int) in [200, 204]"
        fail_msg: >-
          Écriture Vault KO (HTTP {{ vault_write.status | default('n/a') }}) :
          {{ vault_write.json.errors | default(vault_write.msg | default('?')) }}
        success_msg: "Secret mis à jour dans Vault (HTTP {{ vault_write.status | default('n/a') }})"

    - name: "Vault | Relire le secret / Read the secret back"
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ vault_kv_mount }}/data/{{ vault_secret_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_token }}"
          X-Vault-Namespace: "{{ vault_namespace }}"
        return_content: yes
        validate_certs: "{{ not (vault_skip_verify | default(false) | bool) }}"
      delegate_to: localhost
      become: false
      register: vault_read
      failed_when: false
      no_log: true

    - name: "Vault | Diagnostic relecture (champs non sensibles) / Read diagnostic (safe fields)"
      ansible.builtin.debug:
        msg: >-
          Vault read → HTTP {{ vault_read.status | default('n/a') }}
          | url={{ vault_addr }}/v1/{{ vault_kv_mount }}/data/{{ vault_secret_path }}
          | ns={{ vault_namespace }}
          | msg={{ vault_read.msg | default('') }}
          | errors={{ vault_read.json.errors | default([]) }}

    - name: "Vault | Échec si la relecture a raté / Fail if read failed"
      ansible.builtin.assert:
        that: "(vault_read.status | default(0) | int) == 200"
        fail_msg: >-
          Relecture Vault KO (HTTP {{ vault_read.status | default('n/a') }}) :
          {{ vault_read.json.errors | default(vault_read.msg | default('?')) }}
        success_msg: "Secret relu depuis Vault (HTTP {{ vault_read.status | default('n/a') }})"

    - name: "Site | Injecter le secret Vault dans la page / Inject the Vault secret into the page"
      ansible.builtin.replace:
        path: /var/www/html/index.html
        regexp: '__VAULT_SECRET__'
        replace: "{{ vault_read.json.data.data.value }}"
      notify: Restart httpd
      no_log: true

  handlers:
    - name: Restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted