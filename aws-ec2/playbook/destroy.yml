---
- name: Teardown host + delete its Vault secret
  hosts: all
  become: yes
  gather_facts: no

  # Chemin Vault propre à cet hôte / Per-host Vault secret path
  vars:
    vault_secret_path: "{{ inventory_hostname }}"  # le mount porte déjà le nom tfe-vault-aap-onchange

  pre_tasks:
    - name: Wait for system to become reachable
      wait_for_connection:
        delay: 10
        timeout: 120

    - name: Wait for cloud-init to complete
      command: cloud-init status --wait
      changed_when: false
      become: yes
      ignore_errors: yes

    - name: Gather facts after waiting
      setup:

  tasks:
    - name: Afficher le message de debug
      ansible.builtin.debug:
        msg: "coucou destroy"

    # --- Vault : suppression du secret + historique ----------------
    # --- Vault: delete the secret and its history ------------------
    - name: "Vault | Supprimer le secret + historique (KV v2 metadata) / Delete secret and history"
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ vault_kv_mount }}/metadata/{{ vault_secret_path }}"
        method: DELETE
        headers:
          X-Vault-Token: "{{ vault_token }}"
          X-Vault-Namespace: "{{ vault_namespace }}"
        status_code: [204, 404]          # 404 = déjà absent → idempotent / already gone → idempotent
        validate_certs: "{{ not (vault_skip_verify | default(false) | bool) }}"
      delegate_to: localhost
      become: false
      register: vault_delete
      failed_when: false
      no_log: true

    - name: "Vault | Diagnostic suppression (champs non sensibles) / Delete diagnostic (safe fields)"
      ansible.builtin.debug:
        msg: >-
          Vault delete → HTTP {{ vault_delete.status | default('n/a') }}
          | url={{ vault_addr }}/v1/{{ vault_kv_mount }}/metadata/{{ vault_secret_path }}
          | ns={{ vault_namespace }}
          | msg={{ vault_delete.msg | default('') }}
          | errors={{ vault_delete.json.errors | default([]) }}

    - name: "Vault | Échec si la suppression a raté / Fail if delete failed"
      ansible.builtin.assert:
        that: "(vault_delete.status | default(0) | int) in [204, 404]"
        fail_msg: >-
          Suppression Vault KO (HTTP {{ vault_delete.status | default('n/a') }}) :
          {{ vault_delete.json.errors | default(vault_delete.msg | default('?')) }}
        success_msg: "Secret supprimé de Vault (HTTP {{ vault_delete.status | default('n/a') }})"