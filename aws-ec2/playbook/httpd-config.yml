---
- name: Change httpd listening port to 8080 and deploy new website version (RHEL 10)
  hosts: all
  become: yes
  gather_facts: no

  # Chemin Vault propre à cet hôte / Per-host Vault secret path
  vars:
    vault_secret_path: "tfe-vault-aap-onchange/{{ inventory_hostname }}"

  pre_tasks:
    - name: Wait for system to become reachable
      wait_for_connection:
        delay: 10
        timeout: 120

    - name: Wait for cloud-init to complete
      command: cloud-init status --wait
      changed_when: false
      become: yes
      ignore_errors: yes

    - name: Gather facts after waiting
      setup:

  tasks:
    - name: Ensure httpd is installed
      dnf:
        name: httpd
        state: present

    - name: Ensure Git is installed (for clone)
      dnf:
        name: git
        state: present

#    - name: Allow Apache (httpd) to listen on TCP port 8080 in SELinux
#      community.general.seport:
#        ports: 8080
#        proto: tcp
#        setype: http_port_t
#        state: present

    - name: Update Listen port from 80 to 8080 in main httpd.conf
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^Listen\s+80'
        line: 'Listen 8080'
        state: present
        backrefs: no
      notify: Restart httpd

    - name: Create/Update default vhost to use port 8080
      copy:
        dest: /etc/httpd/conf.d/000-default.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <VirtualHost *:8080>
              DocumentRoot "/var/www/html"
              <Directory "/var/www/html">
                  AllowOverride All
                  Require all granted
              </Directory>

              ErrorLog  "/var/log/httpd/error_log"
              CustomLog "/var/log/httpd/access_log" combined
          </VirtualHost>
      notify: Restart httpd

    - name: Ensure /var/www/html exists
      file:
        path: /var/www/html
        state: directory
        owner: apache
        group: apache
        mode: '0755'

    - name: Clone GitHub repo
      git:
        repo: "https://github.com/Sokren/website-rh-hc.git"
        dest: /tmp/website
        version: main
        force: yes

    - name: Deploy new website version
      copy:
        src: "/tmp/website/Version-RH-HC/"
        dest: "/var/www/html"
        owner: apache
        group: apache
        mode: '0755'
        remote_src: yes
      notify: Restart httpd

    - name: Enable and start httpd (ensure it's running)
      service:
        name: httpd
        state: started
        enabled: yes

    # --- Vault : création du secret / secret creation --------------
    - name: "Vault | Générer un secret aléatoire / Generate a random secret"
      ansible.builtin.set_fact:
        vault_secret_value: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"
      no_log: true

    - name: "Vault | Écrire le secret (KV v2) / Write the secret (KV v2)"
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ vault_kv_mount }}/data/{{ vault_secret_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
          X-Vault-Namespace: "{{ vault_namespace }}"
        body_format: json
        body:
          data:
            value: "{{ vault_secret_value }}"
        status_code: [200, 204]
        validate_certs: "{{ not (vault_skip_verify | default(false) | bool) }}"
      delegate_to: localhost
      become: false
      register: vault_write
      failed_when: false          # on diagnostique après (sinon no_log censure l'erreur)
      no_log: true                # protège le token présent dans les headers

    - name: "Vault | Diagnostic écriture (champs non sensibles) / Write diagnostic (safe fields)"
      ansible.builtin.debug:
        msg: >-
          Vault write → HTTP {{ vault_write.status | default('n/a') }}
          | url={{ vault_addr }}/v1/{{ vault_kv_mount }}/data/{{ vault_secret_path }}
          | ns={{ vault_namespace }}
          | msg={{ vault_write.msg | default('') }}
          | errors={{ vault_write.json.errors | default([]) }}

    - name: "Vault | Échec si l'écriture a raté / Fail if write failed"
      ansible.builtin.assert:
        that: "(vault_write.status | default(0) | int) in [200, 204]"
        fail_msg: >-
          Écriture Vault KO (HTTP {{ vault_write.status | default('n/a') }}) :
          {{ vault_write.json.errors | default(vault_write.msg | default('?')) }}
        success_msg: "Secret écrit dans Vault (HTTP {{ vault_write.status | default('n/a') }})"

  handlers:
    - name: Restart httpd
      service:
        name: httpd
        state: restarted
